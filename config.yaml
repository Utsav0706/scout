# Scout runtime config. Non-secret settings only: API keys live in .env.
# Model names use LiteLLM's "provider/model" format so they can be swapped
# here without code changes. Confirm names and prices on the provider pages
# before any paid run.

llm:
  # null = call providers directly. Later: point this at Gearbox
  # (e.g. http://localhost:8000/v1) and Gearbox picks the model.
  base_url: null
  nodes:
    planner:
      model: anthropic/claude-sonnet-5-5
      task_type: plan
      max_tokens: 800
      temperature: 0.2
    researcher:
      model: anthropic/claude-haiku-5-5
      task_type: plan
      max_tokens: 600
      temperature: 0.0
    reader:
      model: anthropic/claude-haiku-5-5
      task_type: extract
      max_tokens: 800
      temperature: 0.0
    writer:
      model: anthropic/claude-sonnet-5-5
      task_type: write
      max_tokens: 2000
      temperature: 0.3
    verifier:
      model: anthropic/claude-haiku-5-5
      task_type: verify
      max_tokens: 1000
      temperature: 0.0
    reviser:
      model: anthropic/claude-sonnet-5-5
      task_type: write
      max_tokens: 2000
      temperature: 0.2

auth:
  token_ttl_minutes: 60

rag:
  # Local models (free, and private documents never leave the machine).
  # Changing the embedding model means re-embedding all chunks (see models.EMBEDDING_DIM).
  embedding_model: BAAI/bge-small-en-v1.5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  chunk_chars: 1500
  chunk_overlap_chars: 200
  candidates: 20   # per search method, before fusion + rerank
  top_k: 5         # results returned to the caller
  max_upload_mb: 20
  max_pages: 300

tools:
  tool_timeout_s: 30        # hard cap on any single tool call
  http_timeout_s: 15
  search_max_results: 5     # Tavily: 1 credit per basic search (free tier: 1,000/month)
  fetch_max_bytes: 2000000  # stop downloading a page after ~2 MB
  fetch_max_chars: 20000    # cleaned text returned to the agent
  max_redirects: 5

limits:
  max_steps: 25
  max_cost_gbp: 0.20
  timeout_s: 180

# LiteLLM reports cost in USD. Update this when you check the rate.
usd_to_gbp: 0.79
