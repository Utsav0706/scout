# Scout runtime config. Non-secret settings only: API keys live in .env.
# Model ids are Anthropic's exact ids (no date suffixes). Prices are below in
# `prices_usd_per_mtok`; check them on the Anthropic pricing page before paid runs.

llm:
  # null = call Anthropic directly. Later: point this at Gearbox and it picks the model.
  base_url: null
  request_timeout_s: 120
  nodes:
    # effort (low|medium|high) replaces temperature: Sonnet 5.5 / Haiku 5.5 reject
    # non-default sampling settings. It sets how hard the model thinks, and so how
    # many tokens it spends.
    # max_tokens includes thinking tokens, so it is a ceiling, not the expected length.
    # fallback: on a safety-classifier refusal, Anthropic re-runs the request on its
    # recommended fallback model (Sonnet only; Haiku has no server-side fallback).
    planner:
      model: claude-sonnet-5-5
      task_type: plan
      effort: medium
      max_tokens: 4000
      fallback: true
    researcher:
      model: claude-haiku-5-5
      task_type: plan
      effort: low
      max_tokens: 2000
    reader:
      model: claude-haiku-5-5
      task_type: extract
      effort: low
      max_tokens: 3000
    writer:
      model: claude-sonnet-5-5
      task_type: write
      effort: medium
      max_tokens: 8000
      fallback: true
    verifier:
      model: claude-haiku-5-5
      task_type: verify
      effort: medium   # accuracy matters most here; on Haiku it costs fractions of a penny
      max_tokens: 3000
    reviser:
      model: claude-sonnet-5-5
      task_type: write
      effort: medium
      max_tokens: 8000
      fallback: true

# USD per million tokens (Anthropic first-party API, checked 2026-10-22).
# Thinking tokens are billed as output. Cache rows are used only once prompt caching is on.
# claude-sonnet-5 is listed because it is the server-side fallback for Sonnet 5.5.
prices_usd_per_mtok:
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}

auth:
  token_ttl_minutes: 60

rag:
  # Local models (free, and private documents never leave the machine).
  # Changing the embedding model means re-embedding all chunks (see models.EMBEDDING_DIM).
  embedding_model: BAAI/bge-small-en-v1.5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  chunk_chars: 1500
  chunk_overlap_chars: 200
  candidates: 20   # per search method, before fusion + rerank
  top_k: 5         # results returned to the caller
  max_upload_mb: 20
  max_pages: 300

tools:
  tool_timeout_s: 30        # hard cap on any single tool call
  http_timeout_s: 15
  search_max_results: 5     # Tavily: 1 credit per basic search (free tier: 1,000/month)
  fetch_max_bytes: 2000000  # stop downloading a page after ~2 MB
  fetch_max_chars: 20000    # cleaned text returned to the agent
  max_redirects: 5
  # When a site refuses us (403 etc.) or the link is a PDF, read it via Tavily Extract
  # instead: 1 credit per 5 successful pages (failures are free).
  extract_fallback: true
  # fetch_url only opens links that this job's web_search returned or that appear in the
  # question. Blocks a page steering the agent to https://attacker/?q=<your data>.
  fetch_only_known_urls: true

agent:
  max_sub_questions: 4
  max_tool_turns: 3          # tool-calling rounds per researcher
  max_sources_to_read: 8     # reader calls in the first research round
  max_source_chars: 8000     # source text sent to the reader and verifier, per source
  max_notes_per_source: 5
  # One extra research round for sub-questions left with no sources, or whose claims
  # all failed verification. Never more than one.
  max_retry_questions: 2
  max_retry_sources: 4       # reader calls in the retry round
  retry_min_budget_gbp: 0.10 # only retry if at least this much of max_cost_gbp is left
  # Money kept back for writing, verifying and revising: research stops early (and the
  # retry round is skipped) rather than leave nothing to finish the report with.
  finish_reserve_gbp: 0.08

telemetry:
  # Traces go to Langfuse when LANGFUSE_* keys are set (see .env.example).
  capture_content: true  # inputs/outputs on spans; personal data masked first
  max_field_chars: 4000  # each input/output is cut to this length

jobs:
  max_running_per_user: 2   # queued + running at once
  max_per_hour_per_user: 10
  # A job still "running" this long after starting has lost its worker (crash, restart):
  # it is marked failed instead of spinning forever.
  stale_after_s: 600

limits:
  # A step is one model call. Worst case without the retry round is ~34 (plan 1,
  # research 12, read 8, write 1, verify 8, revise 1, re-verify 3); the retry round
  # adds up to ~23. Typical runs use 25-40. The cost cap below is the real ceiling.
  max_steps: 50
  max_cost_gbp: 0.20
  timeout_s: 180

# Anthropic bills in USD. Update this when you check the rate.
usd_to_gbp: 0.79
