# Golden-set eval on real models. Manual only: it costs money (about £0.05 per case),
# so it never runs on a push. Start it from the Actions tab ("Run workflow").
#
# Needs repo secrets ANTHROPIC_API_KEY and TAVILY_API_KEY; LANGFUSE_* are optional
# (each case's trace then shows in Langfuse). Results: the run's summary page, plus the
# runs/eval/ folder as an artifact.
name: eval

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "ci (5 cases), all (50), or tags such as: web docs. Ignored when ids are set"
        default: "ci"
        required: false
      ids:
        description: "Only these case ids, space-separated (optional; overrides tags)"
        default: ""
        required: false
      max_cost_gbp:
        description: "Stop starting new cases once this much is spent (GBP)"
        default: "1"
        required: true

permissions:
  contents: read

# One eval at a time: two runs at once would double the spend for no benefit.
concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      # The embedding and reranker models (~200 MB), so they download once, not per run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('config.yaml') }}

      - name: Run the eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          DATABASE_URL: postgresql+psycopg://scout:scout@localhost:5432/scout_eval
          # Inputs arrive as environment variables, never pasted into the script, so a
          # crafted input can't inject shell commands.
          TAGS: ${{ inputs.tags }}
          IDS: ${{ inputs.ids }}
          MAX_COST: ${{ inputs.max_cost_gbp }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$TAVILY_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY and TAVILY_API_KEY repo secrets first."
            exit 1
          fi
          # A missing secret arrives as an empty string; unset it so tracing stays off
          # instead of trying to log in to Langfuse with empty keys.
          for v in LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY LANGFUSE_HOST; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"

          args=(--max-cost-gbp "$MAX_COST")
          # GitHub swaps an empty input for its default, so "all" stands for no tag filter,
          # and ids win over tags (otherwise tags=ci would quietly filter the ids too).
          if [ -n "$IDS" ]; then
            read -ra i <<< "$IDS"; args+=(--ids "${i[@]}")
          elif [ -n "$TAGS" ] && [ "$TAGS" != "all" ]; then
            read -ra t <<< "$TAGS"; args+=(--tags "${t[@]}")
          fi
          python -m scout.eval run "${args[@]}"

      - name: Summary
        if: always()
        run: cat runs/eval/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary written."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: runs/eval/
          retention-days: 30
          if-no-files-found: ignore
