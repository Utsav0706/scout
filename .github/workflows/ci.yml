name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres in CI, so code that only works on the SQLite test DB gets caught.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://scout:scout@localhost:5432/scout_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # CPU-only torch: tests use fake embedders, so the ~2 GB CUDA build is wasted time.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  # The whole Compose stack (db, redis, api, worker) on real Linux: proves a research job
  # travels API -> Redis -> RQ worker -> Postgres. No Anthropic key here, so the job fails
  # cleanly at its first model call and the check costs nothing.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write a .env with a throwaway JWT secret
        run: echo "JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > .env

      # The production files aren't run here (they pull released images), but a typo in
      # them should fail CI, not a deploy.
      - name: Check the production compose file and Caddyfile
        working-directory: deploy
        run: |
          echo "POSTGRES_PASSWORD=ci" > .env
          echo "SCOUT_HOST=example.test" >> .env
          docker compose -f docker-compose.prod.yml config -q
          docker run --rm -e SCOUT_HOST=example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          rm .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: python3 scripts/compose_smoke.py http://localhost:8000

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
