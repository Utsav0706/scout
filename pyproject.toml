[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scout"
version = "0.1.0"
description = "Autonomous research agent: plans, searches, reads, verifies and writes cited reports."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Utsav Jivani (Uv)" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "pypdf>=5.1",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    # 1.x pinned on purpose: 2.0 is new and its changes haven't been reviewed yet.
    "anthropic>=1.17,<2",
    "langgraph>=1.2,<2",
    "anyio>=4.6",
    "rq>=2.0,<3",
    "redis>=5.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx2>=2.13",
    "fakeredis>=2.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics, I: import order, UP: modern syntax,
# B: likely bugs, SIM: simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
