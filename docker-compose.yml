# Local stack. Start with: docker compose up --build
# Memory caps are deliberate: the host has ~3.4 GB free.

services:
  db:
    # Postgres 16 with the pgvector extension preinstalled (needed from M2).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the DB host is "db", not localhost.
      DATABASE_URL: postgresql+psycopg://scout:scout@db:5432/scout
    ports:
      - "8000:8000"
    volumes:
      # Keep downloaded embedding/reranker models (~200 MB) between container restarts.
      - hf_cache:/home/scout/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    # Embedding + reranker models need ~400 MB on top of the API itself.
    mem_limit: 1g

volumes:
  pgdata:
  hf_cache:
